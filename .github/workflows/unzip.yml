name: Unzip

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Path to zip file'
        required: true
        default: 'zamafrica-earthmovers-site.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract files (skipping system/git folders)
        run: |
          # Extract while ignoring problematic .git, .workspace, and .wrangler folders
          unzip -o "${{ github.event.inputs.zip_path }}" -x "*.git*" "*.workspace*" "*.wrangler*" || [ $? -eq 50 ]

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          git commit -m "Unzip ${{ github.event.inputs.zip_path }}" || echo "Nothing to commit"
          
          # Explicitly push to current branch (prevents detached HEAD errors)
          git push origin HEAD:${{ github.ref_name }}
